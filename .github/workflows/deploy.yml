name: Frontend Zero-Downtime Deploy (Build in CI -> Sync Dist)

on:
  push:
    branches:
      - main

concurrency:
  group: frontend_production_deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build in CI & Deploy Dist
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies in CI Runner
        run: npm install

      - name: Build Production Dist Bundle with Server Environment
        env:
          VITE_API_URL: "https://mumbaicharaja.co/api"
          VITE_FIREBASE_API_KEY: "AIzaSyCUiW1PbP1jrAG68qSLrzU_TDKklOHSHdY"
          VITE_FIREBASE_AUTH_DOMAIN: "mumbaicharajawebsite.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "mumbaicharajawebsite"
          VITE_FIREBASE_STORAGE_BUCKET: "mumbaicharajawebsite.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "1087798763150"
          VITE_FIREBASE_APP_ID: "1:1087798763150:web:e64e9ac10f6159528a73df"
          VITE_FIREBASE_MEASUREMENT_ID: "G-E1E1C9V749"
        run: npm run build

      - name: Transfer Pre-built Dist to Lightsail
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || 22 }}
          source: "dist/"
          target: "/home/ec2-user/mumbaicha-raja/temp_dist"
          strip_components: 1

      - name: Atomically Switch Live Symlink on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            RELEASES_DIR="/home/ec2-user/mumbaicha-raja/releases"
            CURRENT_SYMLINK="/home/ec2-user/mumbaicha-raja/frontend-current"
            TEMP_DIR="/home/ec2-user/mumbaicha-raja/temp_dist"
            TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
            NEW_RELEASE="$RELEASES_DIR/frontend_$TIMESTAMP"

            mkdir -p "$RELEASES_DIR"

            # Move uploaded pre-built dist to release folder
            mv "$TEMP_DIR" "$NEW_RELEASE"

            # 0ms Atomic Symlink Switch
            ln -sfn "$NEW_RELEASE" "$CURRENT_SYMLINK"

            # Keep last 5 releases
            cd "$RELEASES_DIR"
            ls -dt frontend_* | tail -n +6 | xargs -r rm -rf

            echo "✅ [Frontend] Pre-built dist deployed successfully with Zero Downtime!"